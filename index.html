<!DOCTYPE html>
<html>
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Daily Attendance</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      margin-top: 0;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 15px 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #timeInButton {
      background: #28a745;
      color: white;
    }

    #timeOutButton {
      background: #dc3545;
      color: white;
    }

    button.active {
      box-shadow: 0 0 0 4px #333 inset;
    }

    #mode {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #result {
      margin-top: 20px;
      padding: 20px;
      border-radius: 12px;
      background: #f1f1f1;
      font-size: 18px;
      min-height: 30px;
    }

    .success {
      background: #dff5e3 !important;
    }

    .error {
      background: #ffe0e0 !important;
    }

    .name {
      font-size: 25px;
      font-weight: bold;
    }

    .action {
      font-size: 22px;
      font-weight: bold;
      margin-top: 10px;
    }

    .hours {
      margin-top: 8px;
      font-size: 18px;
    }

  </style>

</head>

<body>

<div class="container">

  <h1>Daily Attendance</h1>

  <p>Select what you want to record:</p>


  <div class="buttons">

    <button
      id="timeInButton"
      onclick="selectMode('TIME IN')">

      TIME IN

    </button>


    <button
      id="timeOutButton"
      onclick="selectMode('TIME OUT')">

      TIME OUT

    </button>

  </div>


  <div id="mode">
    Select TIME IN or TIME OUT
  </div>


  <div id="reader"></div>


  <div id="result">
    Waiting...
  </div>

</div>


<script>


// =====================================================
// GOOGLE APPS SCRIPT WEB APP URL
// =====================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbyeHzP9DSMZOnQHtK3Ok5MpTP_CggFZf-QlvOX48ja5QEIAqfBe9AHE88_zSQOza1tm/exec";


// =====================================================
// API TOKEN
// =====================================================

const API_TOKEN =
  "ATTENDANCE-2026-9X7K-PHILIPPINES";


let scanner = null;

let scanning = false;

let attendanceMode = null;


// =====================================================
// SELECT TIME IN / TIME OUT
// =====================================================

function selectMode(mode) {

  attendanceMode = mode;


  const timeInButton =
    document.getElementById("timeInButton");

  const timeOutButton =
    document.getElementById("timeOutButton");


  timeInButton.classList.remove("active");

  timeOutButton.classList.remove("active");


  if (mode === "TIME IN") {

    timeInButton.classList.add("active");

  }


  if (mode === "TIME OUT") {

    timeOutButton.classList.add("active");

  }


  document.getElementById("mode").innerHTML =
    "Selected: " + mode;


  document.getElementById("result").className = "";

  document.getElementById("result").innerHTML =
    "Ready to scan...";

}


// =====================================================
// SEND ATTENDANCE
// =====================================================

function sendAttendance(employeeId) {

  const callbackName =
    "attendanceCallback_" + Date.now();


  window[callbackName] = function(response) {

    delete window[callbackName];


    const result =
      document.getElementById("result");


    if (response.success) {

      result.className = "success";


      let extra = "";


      if (
        response.totalHours !== undefined &&
        response.totalHours !== ""
      ) {

        extra =
          "<div class='hours'>" +
          "Total Hours: " +
          response.totalHours +
          "</div>";

      }


      result.innerHTML =

        "<div class='name'>" +
        response.name +
        "</div>" +

        "<div class='action'>" +
        response.type +
        "</div>" +

        "<div>" +
        response.time +
        "</div>" +

        extra;


    } else {

      result.className = "error";

      result.innerHTML =
        response.message;

    }


    // Allow another scan after 3 seconds
    setTimeout(function() {

      result.className = "";

      result.innerHTML =
        "Ready for next scan...";

      startScanner();

    }, 3000);

  };


  const script =
    document.createElement("script");


  const params =
    new URLSearchParams({

      action: "record",

      employeeId: employeeId,

      attendanceType: attendanceMode,

      token: API_TOKEN,

      callback: callbackName

    });


  script.src =
    API_URL + "?" + params.toString();


  script.onerror = function() {

    delete window[callbackName];


    const result =
      document.getElementById("result");


    result.className = "error";

    result.innerHTML =
      "Could not connect to attendance server.";


    setTimeout(function() {

      startScanner();

    }, 3000);

  };


  document.body.appendChild(script);

}


// =====================================================
// QR SCANNED
// =====================================================

async function onScanSuccess(decodedText) {

  // No mode selected
  if (!attendanceMode) {

    document.getElementById("result").className =
      "error";

    document.getElementById("result").innerHTML =
      "Please select TIME IN or TIME OUT first.";

    return;

  }


  // Prevent duplicate scans
  if (scanning) {
    return;
  }


  scanning = true;


  const employeeId =
    decodedText.trim();


  // Stop camera while processing
  if (scanner) {

    try {

      await scanner.clear();

    } catch (error) {

      console.log(error);

    }

  }


  document.getElementById("result").className = "";

  document.getElementById("result").innerHTML =
    "Processing " + attendanceMode + "...";


  sendAttendance(employeeId);

}


// =====================================================
// SCANNING ERRORS
// =====================================================

function onScanFailure(error) {

  // Normal scanning failures are ignored

}


// =====================================================
// START SCANNER
// =====================================================

function startScanner() {

  scanning = false;


  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {

      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    },

    onScanSuccess,

    onScanFailure

  ).catch(function(error) {

    document.getElementById("result").className =
      "error";

    document.getElementById("result").innerHTML =
      "Camera error: " + error;

  });

}


// =====================================================
// START
// =====================================================

startScanner();

</script>

</body>
</html>
